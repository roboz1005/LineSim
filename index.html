<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LineSim</title>
<meta name="theme-color" content="#1c2733">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css"></head>
<body>
<canvas id="c"></canvas>
<div id="chip" hidden></div>
<div id="bar">
 <div class="g"><button data-t="line">Line</button><button data-t="rect">Rect</button><button data-t="circle">Circle</button><button data-t="erase">Erase</button></div>
 <div class="g" id="cols"><input type="color" id="cc" title="Custom color"></div>
 <div class="g"><button data-w=".4">0.4</button><button data-w=".8">0.8</button><button data-w="1.6">1.6</button></div>
 <div class="g"><button data-d="0" title="Continuous">━━</button><button data-d="1" title="Dashed">╍╍</button></div>
 <div class="g"><button data-p="pSnap">Snap ▾</button><button data-p="pMeas">Measure ▾</button></div>
 <div class="g"><button id="bPrev" title="Previous page">◀</button><span id="pgN">1/1</span><button id="bNext" title="Next page">▶</button></div>
 <div class="g"><button id="bUndo" title="Undo">↶</button><button id="bRedo" title="Redo">↷</button></div>
 <div class="g"><button id="bSnip">Snip</button><button data-p="pSet" title="Settings">⚙</button></div>
</div>

<div class="pop" id="pScale" hidden>
 <label>Preset (paper : real) <select id="pre"><option value="">Custom</option></select></label>
 <label>Custom scale <span><input type="text" inputmode="none" data-n data-k="ps"> : <input type="text" inputmode="none" data-n data-k="pr"></span></label>
 <label>Unit <select data-k="unit" id="unit"></select></label>
</div>
<div class="pop" id="pSnap" hidden>
 <label>Snap to points <input type="checkbox" data-k="snapPt"></label>
 <label>Snap onto lines <input type="checkbox" data-k="snapLn"></label>
 <label>Angle snap (15°) <input type="checkbox" data-k="snapAng"></label>
 <label>Step mode <select data-k="step"><option value="off">Off</option><option value="len">Length</option><option value="ang">Angle</option><option value="both">Both</option></select></label>
 <label>Track lines <input type="checkbox" data-k="track"></label>
 <label>Length step (in unit) <input type="text" inputmode="none" data-n data-k="stepLen" placeholder="auto"></label>
 <label>Angle step (°) <input type="text" inputmode="none" data-n data-k="stepAng" placeholder="5"></label>
 <label>Grid <input type="checkbox" data-k="grid"></label>
 <label>Grid step (in unit) <input type="text" inputmode="none" data-n data-k="gridStep" placeholder="auto"></label>
</div>
<div class="pop" id="pMeas" hidden>
 <label>Measurements <input type="checkbox" data-k="meas"></label>
 <label>Between-line angles <input type="checkbox" data-k="betw"></label>
 <label>Hide new lengths &amp; angles <input type="checkbox" data-k="autoHide"></label>
 <label>Angle color <input type="color" data-k="angColor"></label>
 <label>Show scale in note <input type="checkbox" data-k="showScale"></label>
 <label>Length label side <select data-k="side"><option value="top">Top</option><option value="bottom">Bottom</option></select></label>
 <label>Decimals <select data-k="dec"><option value="auto">Auto</option><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
</div>
<div class="pop" id="pSet" hidden>
 <div class="btns"><button data-p="pScale">Scale &amp; unit…</button><button id="bFit" data-x>Fit page</button></div>
 <div class="btns"><button id="bAdd" data-x>Add page</button><button id="bDelPg" data-x>Delete page</button></div>
 <div class="btns"><button id="bClear" data-x>Clear page</button><button id="bHide">Hide UI</button></div>
 <label>Page <select data-k="orient"><option value="p">Portrait</option><option value="l">Landscape</option></select></label>
 <label>Draw with finger <input type="checkbox" data-k="finger"></label>
 <button id="bInst" hidden>Install LineSim</button>
</div>
<aside id="panL"><b id="pTitle">Tap a line to edit</b><small id="pInfo"></small>
 <label for="fLen">Length (<span id="uLen">mm</span>)</label><input id="fLen" class="fld" data-f="len" inputmode="none" readonly>
 <label for="fAng">Angle (°)</label><input id="fAng" class="fld" data-f="ang" inputmode="none" readonly>
 <small>Tap a line, tap a field, type (keypad or keyboard), press OK. Parents stay fixed; this line and its children follow. Shown values stay fixed; hide one to let it flex.</small></aside>
<aside id="panR"><button data-key="0">0</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key=".">.</button><button data-key="del">⌫</button><button data-key="ok" class="ok">OK</button></aside>
<button id="bShow" aria-label="Show UI"></button>
<div id="snap" hidden><div id="sel" hidden></div><div id="sbar"><span>Drag to select an area</span><button id="sPage">Page</button><button id="sCancel">Cancel</button></div></div>
<div id="toast" hidden></div>
<script src="./app.js"></script>
</body></html>
